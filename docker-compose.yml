services:

  db:
    image: postgres:16-alpine
    container_name: koby_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: koby
      POSTGRES_USER: koby_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koby_user -d koby"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - koby_net

  app:
    build:
      context: ./backend
    container_name: koby_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://koby_user:${DB_PASSWORD}@db:5432/koby
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - koby_net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: koby_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificats Let's Encrypt (générés par certbot sur le host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot partagé pour le renouvellement certbot
      - certbot_webroot:/var/www/certbot
    depends_on:
      - app
    networks:
      - koby_net

volumes:
  postgres_data:
  certbot_webroot:

networks:
  koby_net:
    driver: bridge
